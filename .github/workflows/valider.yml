# Vérifie chaque proposition de traduction.
#
# Les erreurs sont posées en annotations directement sur les lignes du diff,
# et pas en commentaire : une proposition venue d'un fork — c'est le cas de
# presque toutes, puisque « modifier ce fichier » depuis le navigateur crée un
# fork — donne au robot un jeton en lecture seule, avec lequel il ne peut pas
# commenter. Les annotations, elles, passent toujours.
name: Valider les traductions

on:
  pull_request:
    paths:
      - 'trad/**.json'

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Lister les fichiers modifiés
        id: fichiers
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          liste=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'trad/**.json' \
                  | grep -v '/_' || true)
          echo "liste<<FIN" >> "$GITHUB_OUTPUT"
          echo "$liste" >> "$GITHUB_OUTPUT"
          echo "FIN" >> "$GITHUB_OUTPUT"
          if [ -z "$liste" ]; then
            echo "aucun fichier de traduction modifié"
          else
            echo "$liste"
          fi

      # `xargs` sans argument lancerait le validateur sur rien, qui répondrait
      # par son mode d'emploi et un code d'erreur : une proposition ne touchant
      # que `_canari.json` échouerait sans rien avoir de faux. D'où le garde
      # dans le shell plutôt qu'une condition sur la sortie de l'étape, qui ne
      # distingue pas une liste vide d'une ligne vide.
      - name: Valider
        run: |
          liste="${{ steps.fichiers.outputs.liste }}"
          if [ -z "$(echo "$liste" | tr -d '[:space:]')" ]; then
            echo "aucun fichier de traduction à valider"
            exit 0
          fi
          echo "$liste" | xargs ruby outils/check_trad.rb --annoter

      - name: Récapitulatif
        if: always()
        env:
          DEPOT: ${{ github.server_url }}/${{ github.repository }}
        run: |
          liste="${{ steps.fichiers.outputs.liste }}"
          [ -z "$(echo "$liste" | tr -d '[:space:]')" ] && exit 0
          {
            echo "## Validation"
            echo
            echo '```text'
            echo "$liste" | xargs ruby outils/check_trad.rb 2>&1 || true
            echo '```'
            echo
            echo "Le détail des messages est expliqué dans [la FAQ]($DEPOT/blob/main/docs/FAQ.md)."
          } >> "$GITHUB_STEP_SUMMARY"
