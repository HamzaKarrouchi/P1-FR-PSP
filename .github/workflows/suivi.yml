# Recalcule l'avancement après chaque fusion, et à heure fixe pour tenir à jour
# le tableau « qui est sur quoi » quand une proposition s'ouvre ou se ferme.
#
# Personne ne met SUIVI.md à jour à la main : c'est la seule façon qu'il soit
# juste, et un chiffre faux sur la page d'accueil décourage plus qu'il ne
# recrute.
name: Mettre à jour le suivi

on:
  push:
    branches: [main]
    paths:
      - 'trad/**.json'
  # Une proposition ouverte doit apparaitre en « en cours » TOUT DE SUITE :
  # sinon deux personnes prennent le meme fichier dans la journee, et c'est
  # precisement ce que le suivi existe pour eviter.
  #
  # `pull_request_target` et non `pull_request`, parce qu'une proposition
  # venue d'un fork ne donne qu'un jeton en lecture seule, avec lequel on ne
  # peut pas committer le suivi. En contrepartie ce declencheur s'execute
  # avec les droits du depot : on ne recupere donc JAMAIS le code de la
  # proposition -- checkout explicite de `main`, et rien d'autre.
  pull_request_target:
    types: [opened, reopened, closed, synchronize, ready_for_review]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: suivi
  cancel-in-progress: true

jobs:
  suivi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # jamais le code de la proposition, voir le commentaire plus haut

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Le suivi lance le validateur pour distinguer un fichier terminé d'un
      # fichier terminé mais cassé. Sans Ruby il s'en passe, et les états
      # deviennent muets sur la santé des traductions.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Relever les propositions ouvertes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,author,files > /tmp/pr.json || echo '[]' > /tmp/pr.json

      - name: Recompter
        run: |
          python outils/stats.py \
            --reservations /tmp/pr.json \
            --rapport /tmp/a_corriger.md \
            --depot "${{ github.server_url }}/${{ github.repository }}"

      # Une seule issue, réécrite en place. Pas une par erreur : un dépôt noyé
      # sous des issues automatiques finit par ce qu'on n'en lise plus aucune.
      # Elle se ferme d'elle-même quand il ne reste rien à corriger.
      - name: Tenir à jour l'issue « Lignes à corriger »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="Lignes à corriger"
          gh label create suivi-auto --color d73a4a \
            --description "Tenu a jour par le robot du suivi" --force || true

          numero=$(gh issue list --label suivi-auto --state all --limit 1 \
                     --json number --jq '.[0].number // empty')

          if [ -s /tmp/a_corriger.md ]; then
            if [ -n "$numero" ]; then
              gh issue edit "$numero" --title "$titre" --body-file /tmp/a_corriger.md
              gh issue reopen "$numero" 2>/dev/null || true
              echo "issue #$numero mise a jour"
            else
              gh issue create --title "$titre" --label suivi-auto \
                --body-file /tmp/a_corriger.md
            fi
          elif [ -n "$numero" ]; then
            gh issue close "$numero" \
              --comment "Plus aucune erreur de validation. Rouverte automatiquement s'il en réapparaît." \
              2>/dev/null || true
            echo "issue #$numero fermee"
          else
            echo "rien a corriger, aucune issue a ouvrir"
          fi

      - name: Committer si ça a bougé
        run: |
          if git diff --quiet -- SUIVI.md .github/badge.json; then
            echo "rien de neuf"
            exit 0
          fi
          git config user.name  "robot du suivi"
          git config user.email "actions@github.com"
          git add SUIVI.md .github/badge.json
          git commit -m "[Suivi] Avancement recalcule"
          # Une fusion peut atterrir pendant qu'on calcule. Plutot que
          # d'echouer et de laisser un suivi perime, on rejoue par-dessus.
          for essai in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          echo "impossible de pousser le suivi apres trois essais" >&2
          exit 1
